name: Push image to dokcerhub

on:
  push:
    branches: 
      - main

jobs:
  build-and-push:
  runs-on: ubuntu-latest
  
   steps:
     # checkout code
     name: checkout code
     uses: actions/checkout@v4

     name: docker login
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKERHUB_USER }}
       password: ${{ secrets.DOCKERHUB_PASSWORD }} 
     name: build-&-push
     uses: docker/build-push-action@v6
      with: .
      file: ./Dockerfile
      push: true
      tags: | 
        ${{ secrets.DOCKERHUB_USER}}/simple-java-app:${{github.ref_name}}  
        ${{ secrets.DOCKERHUB_USER}}/simple-java-app:latest 
      
